<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Charset & responsive -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- ==== Core SEO ==== -->
    <title>KSnap Studio | GTA & Durham Wedding & Portrait Photographer</title>
    <meta
      name="description"
      content="KSnap Studio is a Durham Region & GTA photographer for weddings, engagements, events, and portraits. Serving Pickering, Ajax, Whitby, Oshawa, Toronto & beyond. Book your photoshoot today."
    />
    <!-- ✅ IMPORTANT: use your real domain -->
    <link rel="canonical" href="https://ksnapstudio.ca/" />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <meta name="color-scheme" content="light dark" />

    <!-- Keywords (low impact, safe to include) -->
    <meta
      name="keywords"
      content="Durham photographer, GTA wedding photographer, Durham wedding photographer, Toronto photographer, Mississauga photographer, Markham photographer, Pickering photographer, Ajax photographer, Whitby photographer, Oshawa photographer, event photography Durham, engagement photos Durham, GTA photoshoot"
    />

    <!-- ==== Favicons & PWA ==== -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="%PUBLIC_URL%/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="%PUBLIC_URL%/favicon-16x16.png"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/site.webmanifest" />

    <!-- Theme colors -->
    <meta
      name="theme-color"
      content="#012158"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0b1a33"
      media="(prefers-color-scheme: dark)"
    />

    <!-- ==== Open Graph / Social ==== -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="KSnap Studio" />
    <meta
      property="og:title"
      content="Durham & GTA Wedding & Portrait Photographer | KSnap Studio"
    />
    <meta
      property="og:description"
      content="Weddings, engagements, events, and portraits across Durham Region & the GTA. See packages, galleries, and availability."
    />
    <!-- ✅ IMPORTANT: use your real domain -->
    <meta property="og:image" content="https://ksnapstudio.ca/og-image.jpg" />
    <meta property="og:url" content="https://ksnapstudio.ca/" />

    <!-- Twitter / X (preview only) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Durham & GTA Wedding & Portrait Photographer | KSnap Studio"
    />
    <meta
      name="twitter:description"
      content="Weddings, engagements, events, and portraits across Durham Region & the GTA. See packages, galleries, and availability."
    />
    <!-- ✅ IMPORTANT: use your real domain -->
    <meta name="twitter:image" content="https://ksnapstudio.ca/og-image.jpg" />

    <!-- ==== Structured Data (JSON-LD) ==== -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "KSnap Studio",
        "url": "https://ksnapstudio.ca/"
      }
    </script>

    <!-- ✅ Improved business schema (more SEO-friendly than "Photographer") -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "@id": "https://ksnapstudio.ca/#business",
        "name": "KSnap Studio",
        "url": "https://ksnapstudio.ca/",
        "description": "Durham Region & GTA photographer for weddings, engagements, events, and portraits.",
        "areaServed": ["Durham Region", "Pickering", "Ajax", "Whitby", "Oshawa", "Toronto", "GTA"]
      }
    </script>

    <!-- Prevent flash of wrong color scheme -->
    <script>
      try {
        const isDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.style.colorScheme = isDark ? "dark" : "light";
      } catch (e) {}
    </script>

    <!-- ✅ Google Analytics 4 (KSnap Studio) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-LFKHPTMFQL"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-LFKHPTMFQL");
    </script>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
