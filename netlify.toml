[build]
  command = "npm run build"
  publish = "build"
  functions = "netlify/functions"

[[redirects]]
  from = "/:splat.htm"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/:splat.shtml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/:splat.php"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/:splat.asp"
  to = "/404.html"
  status = 404
  force = true

# ✅ React Router SPA fallback (MUST be last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true